<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wilwatikta — A Sugeng Story</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0b0e1a;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #e8e4d8;
  }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; overflow: hidden;
  }
  #stage {
    position: relative;
    width: min(100vw, calc(100vh * 16 / 9 - 64px));
    max-width: 1280px;
  }
  #game {
    display: block; width: 100%; height: auto;
    background: #10182a; touch-action: none;
    box-shadow: 0 0 0 1px #2a2f45, 0 18px 60px rgba(0, 0, 0, 0.6);
  }
  #hint {
    margin: 10px 0 0; text-align: center;
    font-size: 13px; letter-spacing: 0.02em; color: #9aa3b8;
  }
  #hint b { color: #ffd23e; font-weight: 600; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="720" aria-label="Wilwatikta: open-world crime game. Drive Sugeng through the Javanese city, take on missions, and outrun the WPD police."></canvas>
  <p id="hint"><b>WASD / panah</b> jalan &amp; nyetir &nbsp;·&nbsp; <b>E</b> naik / turun mobil &nbsp;·&nbsp; <b>Shift</b> lari &nbsp;·&nbsp; <b>Spasi</b> rem tangan &nbsp;·&nbsp; <b>R</b> radio gamelan &nbsp;·&nbsp; <b>P</b> jeda &nbsp;·&nbsp; <b>Enter</b> mulai misi</p>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./js/game.js"></script>
</body>
</html>
